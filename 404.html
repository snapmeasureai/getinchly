<style>

  :root { --bg: #FBF7F2; --card: #FFFFFF; --line: rgba(43,34,56,.10); --ink: #2B2238; --ink2: #4F4760; --ink3: #736B82; --leaf: #1F8657; --leaf-soft: #E4F3EA; --leaf-ink: #14603E;

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  .bar { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--display); font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; }
  .bar nav { display: flex; gap: 22px; }
  .bar nav a { color: var(--ink2); text-decoration: none; font-weight: 600; font-size: 15px; }
  .hero { padding: 48px 0 12px; }
  h1, h2 { font-family: var(--display); font-weight: 600; letter-spacing: -.02em; line-height: 1.12; }
  h1 { font-size: clamp(38px, 6vw, 56px); margin: 0 0 10px; }
  .sub { font-size: 19px; color: var(--ink2); margin: 0; }
  .meta { color: var(--ink3); font-size: 14.5px; margin-top: 10px; }

  .toc { position: sticky; top: 20px; align-self: start; font-size: 14.5px; }
  .toc p { font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); margin: 0 0 8px; }
  .toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .toc a { color: var(--ink2); text-decoration: none; }
  .toc a:hover { color: var(--ink); text-decoration: underline; }
  article { max-width: 720px; min-width: 0; }
  article h2 { font-size: 27px; margin: 44px 0 12px; scroll-margin-top: 20px; }
  article ul { padding-left: 22px; }
  article li { margin: 4px 0; }
  .summary { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--leaf); border-radius: 16px; padding: 18px 22px; }
  .summary p { margin: 0 0 6px; font-weight: 800; }
  .summary ul { margin: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 15.5px; margin: 10px 0; }
  th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  th { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); }
  .tablewrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  footer { border-top: 1px solid var(--line); padding: 28px 0 44px; color: var(--ink3); font-size: 14.5px; }
  footer nav { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 8px; }
  footer a { color: var(--ink2); font-weight: 600; text-decoration: none; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; gap: 8px; } .toc { position: static; } .bar nav a.hide-sm { display: none; } }
